name: DeepSWE Sage-A1.5 (full run)

# Full DeepSWE run for Sage-A1.5: the 106 tasks not completed in the pilot,
# split into batches of 5 (batches-remaining.json in this repo).
# Runs in quota-paced waves: each invocation (manual dispatch or the
# 5-hourly schedule) runs the next 4 unfinished batches (~20 tasks,
# ~8,000 ink at the pilot's measured rate) and publishes compact results
# to the "results" branch, so progress survives across waves.
# 6 waves finish the set (~30h). Required secret: INTERN_DISCOVERY_KEY.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */5 * * *"

concurrency:
  group: deepswe-full
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      has_work: ${{ steps.pick.outputs.has_work }}
    steps:
      - name: Check out repo (batch list)
        uses: actions/checkout@v4

      - name: Pick the next wave of unfinished batches
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Which batches already published results?
          DONE=""
          if git ls-remote --exit-code --heads origin results >/dev/null 2>&1; then
            git fetch --quiet origin results
            DONE=$(git ls-tree -r --name-only origin/results -- runs/full \
                   | sed -n 's#runs/full/batch-\([0-9]*\)\.json#\1#p' | sort -n | tr '\n' ' ')
          fi
          echo "Completed batches: ${DONE:-none}"
          python3 - "$DONE" <<'PYEOF'
          import json, sys
          done = {int(x) for x in sys.argv[1].split()} if len(sys.argv) > 1 and sys.argv[1].strip() else set()
          batches = json.load(open("batches-remaining.json"))
          todo = [{"index": i, "tasks": " ".join(b)} for i, b in enumerate(batches) if i not in done][:4]
          with open("/tmp/matrix.json", "w") as f:
              json.dump({"include": todo}, f)
          print("Next wave:", [t["index"] for t in todo])
          PYEOF
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          if [ "$(python3 -c 'import json;print(len(json.load(open("/tmp/matrix.json"))["include"]))')" -gt 0 ]; then
            echo "has_work=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "All batches complete - nothing to do."
          fi

  run:
    needs: pick
    if: needs.pick.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.pick.outputs.matrix) }}
    env:
      OPENAI_API_KEY: ${{ secrets.INTERN_DISCOVERY_KEY }}
      OPENAI_API_BASE: https://discovery-api.intern-ai.org.cn/v1
      MSWEA_COST_TRACKING: ignore_errors
    steps:
      - name: Clone DeepSWE tasks
        run: git clone --depth 1 https://github.com/datacurve-ai/deep-swe ds
