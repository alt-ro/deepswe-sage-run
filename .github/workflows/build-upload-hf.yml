name: Build abliterated model and upload to HF

on:
  workflow_dispatch:
    inputs:
      hf_repo:
        description: "Hugging Face repo id"
        required: true
        default: "hereisahmed/Sage-A1.5-ICE-Abliterated"

permissions:
  contents: read

jobs:
  build-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Check out repo (adapters + patcher)
        uses: actions/checkout@v4
      - name: Reassemble adapters from chunks
        run: |
          cat bisect/clean-a? > adapter-clean.gguf
          cat bisect/attnq-a? > adapter-attnq.gguf
          cp bisect/routers-aa adapter-routers.gguf
          echo "89ae6cc820c46e86af0c2c056c74ad1f506d2af439fd3891f5a7b4b6c3aef35d  adapter-clean.gguf" | sha256sum -c -
          echo "234d5d3f82041e92571fdcacf7940a68c9d0b0bba1172188eec442eb54487ed0  adapter-attnq.gguf" | sha256sum -c -
          echo "dac8b79448c38bd10db8e9857e1eca07656e1d3370a0ca0c344cffae28f1d105  adapter-routers.gguf" | sha256sum -c -
      - name: Download ICE model (16 connections)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2
          aria2c -x 16 -s 16 -k 8M --console-log-level=warn --summary-interval=30 \
            -o model.gguf "https://huggingface.co/gbuzhf/Sage-A1.5-Sangreal-ICE/resolve/main/Sage-A1.5-15G-ICEv2.gguf"
          echo "b67e38a41fa2b1b473364b3c75b1aba45b17c74524203d4fe6caddcb7f37e292  model.gguf" | sha256sum -c -
      - name: Patch the model (routers + attn_q direct edits)
        run: |
          pip install -q gguf numpy huggingface_hub
          python3 package/patch_ice.py model.gguf \
            --routers adapter-routers.gguf --attnq adapter-attnq.gguf \
            --out Sage-A1.5-15G-ICEv2-abliterated.gguf
          rm model.gguf
          ls -la Sage-A1.5-15G-ICEv2-abliterated.gguf
          df -h / | tail -1
      - name: Smoke test the patched model
        run: |
          curl -sL -o llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b12250/llama-b12250-bin-ubuntu-x64.tar.gz
          mkdir llama && tar -xzf llama.tar.gz -C llama --strip-components=1
          export LD_LIBRARY_PATH=$PWD/llama
          ./llama/llama-completion -m Sage-A1.5-15G-ICEv2-abliterated.gguf \
            --lora adapter-clean.gguf \
            -p "The capital of France is" -n 16 --temp 0 -t 4 -c 512 --no-display-prompt
      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ inputs.hf_repo }}
        run: |
          cat > model-card.md <<'EOF'
          ---
          license: apache-2.0
          base_model: InternScience/Sage-A1.5
          ---
          # Sage-A1.5 — Sangreal ICE 2.0, abliterated

          gbuzhf's `Sage-A1.5-15G-ICEv2.gguf` with the Ablitrex abliteration
          (stock vs mostwanted002 Ablitrex BF16 delta, 99% energy trim)
          applied:

          - `Sage-A1.5-15G-ICEv2-abliterated.gguf` — router and attention-q
            deltas written directly into the weights (llama.cpp applies
            those two classes incorrectly via LoRA).
          - `adapter-clean.gguf` — the remaining classes (experts, ssm_out,
            attn_k/v, attn_output) as a standard LoRA. **Load it alongside
            the model**; the abliteration is the combination of both.

          Run with llama.cpp:

          ```
          llama-completion -m Sage-A1.5-15G-ICEv2-abliterated.gguf --lora adapter-clean.gguf -p "..."
          ```

          Credits: InternScience (Sage-A1.5), gbuzhf (Sangreal ICE
          quantisation), mostwanted002 (Ablitrex).
          EOF
          python3 - <<'PYEOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = os.environ["HF_REPO"]
          api.create_repo(repo_id=repo, repo_type="model", exist_ok=True)
          for path, name in [
              ("Sage-A1.5-15G-ICEv2-abliterated.gguf", "Sage-A1.5-15G-ICEv2-abliterated.gguf"),
              ("adapter-clean.gguf", "adapter-clean.gguf"),
              ("model-card.md", "README.md"),
          ]:
              print("uploading", name, flush=True)
              api.upload_file(path_or_fileobj=path, path_in_repo=name,
                              repo_id=repo, repo_type="model")
              print("done", name, flush=True)
          print("ALL UPLOADED")
          PYEOF
