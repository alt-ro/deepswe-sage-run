name: DeepSWE Sage-A1.5 (full run)

# Full DeepSWE run for Sage-A1.5: the 106 tasks not completed in the pilot,
# split into batches of 5 (batches-remaining.json in this repo).
# Runs in quota-paced waves: each invocation (manual dispatch or the
# 5-hourly schedule) runs the next 4 unfinished batches (~20 tasks,
# ~8,000 ink at the pilot's measured rate) and publishes compact results
# to the "results" branch, so progress survives across waves.
# 6 waves finish the set (~30h). Required secret: INTERN_DISCOVERY_KEY.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */5 * * *"

concurrency:
  group: deepswe-full
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      has_work: ${{ steps.pick.outputs.has_work }}
    steps:
      - name: Check out repo (batch list)
        uses: actions/checkout@v4

      - name: Pick the next wave of unfinished batches
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Which batches already published results?
          DONE=""
          if git ls-remote --exit-code --heads origin results >/dev/null 2>&1; then
            git fetch --quiet origin results
            DONE=$(git ls-tree -r --name-only origin/results -- runs/full \
                   | sed -n 's#runs/full/batch-\([0-9]*\)\.json#\1#p' | sort -n | tr '\n' ' ')
          fi
          echo "Completed batches: ${DONE:-none}"
          python3 - "$DONE" <<'PYEOF'
          import json, sys
          done = {int(x) for x in sys.argv[1].split()} if len(sys.argv) > 1 and sys.argv[1].strip() else set()
          batches = json.load(open("batches-remaining.json"))
          todo = [{"index": i, "tasks": " ".join(b)} for i, b in enumerate(batches) if i not in done][:4]
          with open("/tmp/matrix.json", "w") as f:
              json.dump({"include": todo}, f)
          print("Next wave:", [t["index"] for t in todo])
          PYEOF
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          if [ "$(python3 -c 'import json;print(len(json.load(open("/tmp/matrix.json"))["include"]))')" -gt 0 ]; then
            echo "has_work=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "All batches complete - nothing to do."
          fi

  run:
    needs: pick
    if: needs.pick.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.pick.outputs.matrix) }}
    env:
      OPENAI_API_KEY: ${{ secrets.INTERN_DISCOVERY_KEY }}
      OPENAI_API_BASE: https://discovery-api.intern-ai.org.cn/v1
      MSWEA_COST_TRACKING: ignore_errors
    steps:
      - name: Clone DeepSWE tasks
        run: git clone --depth 1 https://github.com/datacurve-ai/deep-swe ds
        
      - name: Install uv + Pier
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install --force --with python-socks datacurve-pier
          pier --version
          docker version --format '{{.Server.Version}}'

      - name: Run batch ${{ matrix.index }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ARGS=""
          for t in ${{ matrix.tasks }}; do ARGS="$ARGS -i $t"; done
          echo "Tasks in batch ${{ matrix.index }}: $ARGS"
          pier run -p ds/tasks $ARGS \
            --env docker \
            -a mini-swe-agent \
            -m openai/Sage-A1.5 \
            -n 2 \
            -o jobs \
            --job-name "batch-${{ matrix.index }}" \
            -y

      - name: Publish compact results to the results branch
        if: always()
        env:
          BATCH_INDEX: ${{ matrix.index }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p summary
          python3 - <<'PYEOF'
          import glob, json, os
          out = {"batch_index": int(os.environ.get("BATCH_INDEX", "0")), "trials": []}
          for f in sorted(glob.glob("jobs/*/result.json")):
              r = json.load(open(f))
              out["job_stats"] = r.get("stats", {})
              for t in glob.glob(os.path.join(os.path.dirname(f), "*", "result.json")):
                  tr = json.load(open(t))
                  vr = (tr.get("verifier_result") or {}).get("rewards", {})
                  ar = tr.get("agent_result") or {}
                  out["trials"].append({
                      "trial": tr.get("trial_name"),
                      "reward": vr.get("reward"),
                      "f2p_passed": vr.get("f2p_passed"), "f2p_total": vr.get("f2p_total"),
                      "p2p_passed": vr.get("p2p_passed"), "p2p_total": vr.get("p2p_total"),
                      "exception": (tr.get("exception_info") or {}).get("exception_type"),
                      "n_input_tokens": ar.get("n_input_tokens"),
                      "n_output_tokens": ar.get("n_output_tokens"),
                  })
          json.dump(out, open("summary/batch.json", "w"), indent=1)
          print(json.dumps(out)[:400])
          PYEOF
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pub
          cd pub
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin results 2>/dev/null || true
            git checkout results 2>/dev/null || git checkout --orphan results
            mkdir -p runs/full
            cp ../summary/batch.json "runs/full/batch-${{ matrix.index }}.json"
            git config user.name "deepswe-runner"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "results: full batch ${{ matrix.index }} (run ${{ github.run_id }})" || { echo "nothing to commit"; break; }
            if git push origin results; then echo "published"; break; fi
            echo "push raced, retrying ($attempt)"; sleep $((RANDOM % 10 + 3))
            git reset --hard HEAD~1 2>/dev/null || true
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepswe-full-batch-${{ matrix.index }}
          path: jobs/
          retention-days: 30
          if-no-files-found: warn
